<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="app">
    <header class="header">
      <div class="logo">🌐</div>
      <h1>SwapIP</h1>
      <button class="gear-btn" id="settingsBtn" title="Настройки">⚙</button>
    </header>

    <!-- Вкладки -->
    <nav class="tabs">
      <button class="tab active" data-tab="main">⚡ Главная</button>
      <button class="tab" data-tab="servers">📡 Серверы</button>
      <button class="tab" data-tab="countries">🌍 Страны</button>
    </nav>

    <!-- ============ ВКЛАДКА: ГЛАВНАЯ ============ -->
    <div class="tab-page active" id="page-main">
      <div class="status-card" id="statusCard">
        <div class="status-indicator" id="statusIndicator"></div>
        <div class="status-text">
          <div class="status-title" id="statusTitle">Отключено</div>
          <div class="status-sub" id="statusSub">Прямое соединение</div>
        </div>
        <button class="check-btn" id="checkBtn" title="Проверить текущее соединение">⚡</button>
      </div>

      <!-- Локация текущего соединения -->
      <div class="location-card" id="locationCard">
        <div class="location-flag" id="locFlag">🌍</div>
        <div class="location-info">
          <div class="location-label" id="locLabel">Ваша локация</div>
          <div class="location-value" id="locValue">Прямое соединение — локация не изменена</div>
          <div class="location-meta" id="locMeta"></div>
        </div>
      </div>

      <button class="connect-btn" id="connectBtn">
        <svg class="btn-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round">
          <path d="M12 2v10"/>
          <path d="M18.36 6.64a9 9 0 1 1-12.72 0"/>
        </svg>
        <span class="btn-text" id="btnText">Подключиться</span>
      </button>

      <!-- Прогресс подбора: видно, что расширение не зависло -->
      <div class="connect-progress" id="connectProgress" hidden>
        <div class="progress-track"><div class="progress-bar" id="progressBar"></div></div>
        <div class="progress-text" id="progressText">Проверяем прокси…</div>
      </div>

      <div class="footer">
        <div class="stats" id="stats">Загрузка…</div>
        <label class="import-btn" title="Импорт списка прокси (JSON или TXT)">
          📁 Импорт
          <input type="file" id="importFile" accept=".json,.txt" hidden>
        </label>
      </div>

      <!-- Аварийная кнопка: снимает прокси в браузере, что бы ни было в состоянии -->
      <div class="emergency">
        <button class="emergency-btn" id="emergencyBtn" title="Снять прокси, если сеть не работает">
          🆘 Сеть не работает — сбросить прокси
        </button>
        <div class="emergency-hint" id="emergencyHint"></div>
      </div>
    </div>

    <!-- ============ ВКЛАДКА: СЕРВЕРЫ ============ -->
    <div class="tab-page" id="page-servers">
      <div class="filter-row">
        <select id="serverFilter">
          <option value="all">Все протоколы</option>
          <option value="http">HTTP</option>
          <option value="socks5">SOCKS5</option>
          <option value="socks4">SOCKS4</option>
        </select>
        <select id="serverSort">
          <option value="ping">Сортировка: пинг ↑</option>
          <option value="country">Сортировка: страна</option>
        </select>
      </div>
      <div class="hint-line" id="serversHint">Измеренные серверы: …</div>
      <div class="server-list" id="serverList"></div>
    </div>

    <!-- ============ ВКЛАДКА: СТРАНЫ ============ -->
    <div class="tab-page" id="page-countries">
      <div class="filter-row">
        <select id="countrySort">
          <option value="ping">Сортировка: быстрейший пинг</option>
          <option value="count">Сортировка: кол-во прокси</option>
          <option value="name">Сортировка: название</option>
        </select>
        <button class="refresh-btn big" id="refreshBtn" title="Обновить список прокси">⟳</button>
      </div>
      <div class="filter-row">
        <button class="wide-btn" id="bundledBtn" title="Загрузить список, встроенный в расширение">
          📦 Встроенный список
        </button>
      </div>
      <div class="countries" id="countries"></div>
    </div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
